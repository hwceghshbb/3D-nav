/**:
  ros__parameters:
    use_sim_time: false
    output_odom_topic: /visual_slam/tracking/odometry
    output_slam_pose_topic: /visual_slam/tracking/slam_odometry
    use_gpu: true
    async_sba: true
    enable_slam_backend: true
    slam_sync_mode: true
    slam_throttling_time_ms: 0

/cuvslam_imu_combiner:
  ros__parameters:
    gyro_topic: /hardware/body_depth_camera/gyro/sample
    accel_topic: /hardware/body_depth_camera/accel/sample
    output_topic: /nav/imu
    output_frame_id: body_depth_camera_imu_frame
    max_accel_age_ms: 20.0
    # Initial D435i values. Replace these with the measured IMU Allan variance.
    gyro_variance: 5.9536e-8
    accel_variance: 3.467e-6

/localization_odom_bridge:
  ros__parameters:
    input_odom_topic: /visual_slam/tracking/odometry
    rig_ready_topic: /nav/rig_ready
    output_odom_topic: /nav/odom
    valid_topic: /nav/localization_valid
    odom_frame: odom
    base_frame: bxi_base_link
    odom_timeout_sec: 0.25
    max_position_variance: 0.25
    max_orientation_variance: 0.25
    require_covariance: false

/base_global_pose_publisher:
  ros__parameters:
    target_frame: map
    tracked_frame: bxi_base_link
    output_topic: /nav/base_footprint/pose
    valid_topic: /nav/localization_valid
    odom_topic: /nav/odom
    publish_hz: 30.0
    transform_timeout_sec: 0.1
    copy_odom_twist: true

/head_camera_global_pose_publisher:
  ros__parameters:
    target_frame: map
    tracked_frame: head_depth_camera_depth_optical_frame
    output_topic: /nav/head_depth_camera/pose
    valid_topic: /nav/localization_valid
    odom_topic: /nav/odom
    publish_hz: 30.0
    transform_timeout_sec: 0.1
    copy_odom_twist: false
