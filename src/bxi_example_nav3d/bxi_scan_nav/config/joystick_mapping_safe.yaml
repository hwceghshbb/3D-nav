sources:
  gamepad:
    type: joystick
    device: /dev/input/js0
    signals:
      gamepad.left_y:
        from: js.axis.1
        timeout_ms: 3000
        failsafe: 0.0
      gamepad.left_x:
        from: js.axis.0
        timeout_ms: 3000
        failsafe: 0.0
      gamepad.normal:
        from: js.button.0
      gamepad.recover:
        from: js.button.1

curves:
  stick:
    type: expo
    deadzone: 0.05
    expo: 0.15
    limit: [-1.0, 1.0]

controls:
  move.vx:
    type: analog
    sources:
    - source: gamepad.left_y
      direction: -1
      curve: stick
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.08
  move.vy:
    type: analog
    sources:
    - source: gamepad.left_x
      scale: 0.0
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.08
  move.yaw:
    type: analog
    sources:
    - source: gamepad.left_x
      direction: -1
      curve: stick
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.10
  gamepad.normal_event:
    type: bool
    source: gamepad.normal
  gamepad.recover_event:
    type: bool
    source: gamepad.recover

outputs:
  conflict_policy: first_wins
  publish_on_change: false
  analog:
    vx:
      control: move.vx
      scale: 0.18
      limit: [-0.18, 0.18]
    vy:
      control: move.vy
      scale: 0.08
      limit: [-0.08, 0.08]
    yaw:
      control: move.yaw
      scale: 0.25
      limit: [-0.25, 0.25]
  level:
  - output: btn_1=1
    when:
    - gamepad.normal_event
  - output: btn_6=1
    when:
    - gamepad.recover_event
