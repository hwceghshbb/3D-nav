schema: 1
id: com.bxi.ballet
version: 1.0.0
api: 1
entrypoint: plugin:create_mod
visibility: protected
events:
  activate: {slot: btn_10, value: 3}
  toggle_pause: {slot: btn_9, value: 1}
states:
  ballet:
    manifest:
      label: 芭蕾舞
      index: 11
      group: Advanced
      icon: wand_stars
      confirm: true
      confirm_message: 请确保机器人周围5米范围内没有障碍物
routes:
  - {from: com.bxi.normal/normal, event: activate, to: ballet, transition: soft_switch}
  - from: ballet
    event: com.bxi.normal/activate
    to: com.bxi.normal/normal
    transition: {profile: dual_running_blend, duration: 1.0}
  - {from: ballet, event: toggle_pause, action: toggle_pause}
