schema: 1
id: com.bxi.any_motion
name: 任意动作
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: protected
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros: []
  system: []

events:
  activate:
    slot: btn_10
    value: 10
  toggle_pause:
    slot: btn_9
    value: 1

states:
  any_motion:
    params:
      npz: assets/lichenxi.npz
    manifest:
      label: 任意动作
      priority: 880
      group: Advanced
      icon: animation_play
      confirm: true
      confirm_message: 请确认动作文件与当前机器人和场地匹配

routes:
  - from: com.bxi.basic_actions/normal
    event: activate
    to: any_motion
    transition: soft_switch
  - from: any_motion
    event: com.bxi.basic_actions/normal
    to: com.bxi.basic_actions/normal
    transition:
      profile: dual_running_blend
      duration: 0.6

actions:
  - from: any_motion
    event: toggle_pause
    action: toggle_pause
    manifest:
      label: 暂停/继续
      ui: pause
